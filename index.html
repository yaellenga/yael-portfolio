<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yael Lenga</title>

  <!-- Fonts from Google Fonts: Mynerve (handwriting) and Carlito (project labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@700&family=Mynerve&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="visually-hidden">Cool stuff by Yael Lenga</h1>

  <!-- Two columns of 4 screens each. When you scroll, the left one moves up and the right one moves down.
       The two halves of each project meet in the middle along the way. -->
  <main class="split">

    <!-- LEFT COLUMN (starts at Screen 1, moves up) -->
    <div class="split-column split-left">

      <!-- Screen 1 · Cool stuff by (table photo) -->
      <section class="screen">
        <img class="screen-photo" src="images/home-table-photo.jpg" alt="A festive table with flowers, candles, pumpkins and pine cones">
        <p class="placed pin-bottom handwriting cool-stuff" aria-hidden="true">Cool stuff by</p>
      </section>

      <!-- Screen 2 · trac. (headline and the app on a phone) — opens the trac. page -->
      <a class="screen screen-link screen-blue has-project-cursor" href="trac.html" data-cursor="trac">
        <!-- The headline, the "never lose a beat again" tag and the cable, as one picture -->
        <img class="placed box center-y left-trac-headline" src="images/home-trac-headline.svg" alt="Songwriting, but simpler. Never lose a beat again.">
        <div class="placed box center-y left-trac-phone">
          <img class="whole-image" src="images/home-trac-phone.png" alt="The trac. app home screen on a phone">
        </div>
      </a>

      <!-- Screen 3 · Hamotzi (left half of the picture) — opens the Hamotzi page -->
      <a class="screen screen-link screen-white has-project-cursor" href="hamotzi.html" data-cursor="hamotzi">
        <div class="placed box crop center-y left-hamotzi">
          <img src="images/home-hamotzi.jpg" alt="Hamotzi — a hand rolling up the sleeve of a white shirt over a snake tattoo">
        </div>
      </a>

      <!-- Screen 4 · Lets Talk About It (a pattern of the boy lying on the grass) -->
      <section class="screen screen-green has-project-cursor" data-cursor="lets-talk">
        <img class="screen-photo" src="images/home-lets-talk-pattern.jpg" alt="Lets Talk About It — a pattern of a boy lying on the grass, repeated">
      </section>
    </div>

    <!-- RIGHT COLUMN (starts at Screen 4, moves down) -->
    <div class="split-column split-right">

      <!-- Screen 1 · Lets Talk About It (a tree from the illustration, and the label) -->
      <section class="screen screen-green has-project-cursor" data-cursor="lets-talk">
        <div class="placed box right-lets-talk">
          <img class="whole-image" src="images/home-lets-talk-tree.png" alt="Lets Talk About It — illustration of a big tree">
        </div>
        <p class="placed pin-bottom project-label label-lets-talk">lets talk about it<br>web&amp;app design<br>illustration</p>
        <p class="placed pin-bottom project-year year-lets-talk">2026</p>
      </section>

      <!-- Screen 2 · Hamotzi (right half of the picture and label) — opens the Hamotzi page -->
      <a class="screen screen-link screen-white has-project-cursor" href="hamotzi.html" data-cursor="hamotzi">
        <div class="placed box crop center-y right-hamotzi">
          <img src="images/home-hamotzi.jpg" alt="">
        </div>
        <p class="placed pin-bottom project-label label-hamotzi">Hamotzi<br>video art<br>art direction&amp;filming</p>
        <p class="placed pin-bottom project-year year-hamotzi">2024</p>
      </a>

      <!-- Screen 3 · trac. (photo and label) — opens the trac. page -->
      <a class="screen screen-link has-project-cursor" href="trac.html" data-cursor="trac">
        <img class="screen-photo right-trac-photo" src="images/home-trac-photo.jpg" alt="A musician playing guitar in a home studio">
        <p class="placed pin-bottom project-label label-trac">trac.<br>ux\ui<br>app design</p>
        <p class="placed pin-bottom project-year year-trac">2025</p>
      </a>

      <!-- Screen 4 · Yael Lenga (what you see first) -->
      <section class="screen screen-orange">
        <p class="placed pin-bottom handwriting home-name">
          <a class="handwriting-link" href="about.html">Yael Lenga</a>
        </p>
      </section>
    </div>

  </main>

  <!-- The special mouse shown over a project screen (see custom-cursor.js) -->
  <img class="project-cursor" src="images/cursor-trac.svg" alt="" aria-hidden="true">

  <script src="split-scroll.js"></script>
  <script src="custom-cursor.js"></script>
</body>
</html>
