<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yael Lenga</title>

  <!-- Fonts from Google Fonts: Mynerve (handwriting) and Carlito (project labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@700&family=Mynerve&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="visually-hidden">Cool stuff by Yael Lenga</h1>

  <!-- Two columns of 4 screens each. When you scroll, the left one moves up and the right one moves down.
       The two halves of each project meet in the middle along the way. -->
  <main class="split">

    <!-- LEFT COLUMN (starts at Screen 1, moves up) -->
    <div class="split-column split-left">

      <!-- Screen 1 · Cool stuff by -->
      <section class="screen screen-orange">
        <p class="placed pin-bottom handwriting cool-stuff" aria-hidden="true">Cool stuff by</p>
      </section>

      <!-- Screen 2 · Hamotzi (left half of the image) -->
      <section class="screen">
        <img class="screen-photo left-hamotzi" src="images/home-hamotzi.jpg" alt="Hamotzi — video art">
      </section>

      <!-- Screen 3 · trac. (the app on a phone) -->
      <section class="screen screen-blue">
        <div class="placed box left-trac-phone">
          <img class="whole-image" src="images/home-trac-phone.png" alt="The trac. app home screen on a phone">
        </div>
      </section>

      <!-- Screen 4 · Lets Talk About It (right half of the illustration) -->
      <section class="screen screen-green">
        <div class="placed box crop left-lets-talk">
          <img src="images/home-lets-talk.png" alt="">
        </div>
      </section>
    </div>

    <!-- RIGHT COLUMN (starts at Screen 4, moves down) -->
    <div class="split-column split-right">

      <!-- Screen 1 · Lets Talk About It (left half of the illustration, Hebrew title, label) -->
      <section class="screen screen-green">
        <p class="placed pin-bottom project-label label-lets-talk">lets talk about it<br>web&amp;app design<br>illustration</p>
        <p class="placed pin-bottom project-year year-lets-talk">2026</p>
        <div class="placed box crop right-lets-talk">
          <img src="images/home-lets-talk.png" alt="Lets Talk About It — illustration of a boy lying on the grass">
        </div>
        <div class="placed box right-lets-talk-name">
          <img class="whole-image" src="images/home-lets-talk-title.png" alt="בואי נדבר על זה" lang="he">
        </div>
      </section>

      <!-- Screen 2 · trac. (photo and label) -->
      <section class="screen">
        <img class="screen-photo right-trac-photo" src="images/home-trac-photo.jpg" alt="A musician playing guitar in a home studio">
        <p class="placed pin-bottom project-label label-trac">trac.<br>ux\ui<br>app design</p>
        <p class="placed pin-bottom project-year year-trac">2024</p>
      </section>

      <!-- Screen 3 · Hamotzi (right half of the image and label) -->
      <section class="screen">
        <img class="screen-photo right-hamotzi" src="images/home-hamotzi.jpg" alt="">
        <p class="placed pin-bottom project-label label-hamotzi">Hamotzi<br>video art<br>art direction&amp;filming</p>
        <p class="placed pin-bottom project-year year-hamotzi">2024</p>
      </section>

      <!-- Screen 4 · Yael Lenga (what you see first) -->
      <section class="screen">
        <img class="screen-photo right-table-photo" src="images/home-table-photo.jpg" alt="A festive table with flowers, candles, pumpkins and pine cones">
        <p class="placed pin-bottom handwriting home-name" aria-hidden="true">Yael Lenga</p>
      </section>
    </div>

  </main>

  <script src="split-scroll.js"></script>
</body>
</html>
